          PAYLOAD
          tr -d '\n\r ' < /tmp/v11.b64 | base64 -d > /tmp/v11.zip
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q /tmp/v11.zip -d "$GITHUB_WORKSPACE/project"
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          grep -q 'jvmTarget = "17"' "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          echo "Java/Kotlin target both 17"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable preinstalled Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and stage APK
        shell: bash
        run: |
          APK="$(find "$GITHUB_WORKSPACE/project/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/CandyAutoV11.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CandyAutoV11-APK
          path: CandyAutoV11.apk
          if-no-files-found: error
          retention-days: 14

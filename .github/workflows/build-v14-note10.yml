          PAYLOAD
          tr -d '\n\r ' < /tmp/v14.b64 | base64 -d > /tmp/v14.zip
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q /tmp/v14.zip -d "$GITHUB_WORKSPACE/project"
          grep -q 'applicationId = "com.tsufung.candyhintv14note10"' "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          grep -q 'targetSdk = 31' "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          ! grep -R "androidx\." "$GITHUB_WORKSPACE/project/app/src/main"
          ! grep -R "BIND_ACCESSIBILITY_SERVICE" "$GITHUB_WORKSPACE/project/app/src/main"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign APK for maximum compatibility
        shell: bash
        run: |
          UNSIGNED="$(find "$GITHUB_WORKSPACE/project/app/build/outputs/apk/release" -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$GITHUB_WORKSPACE/CandyHintV14-aligned.apk"

          keytool -genkeypair             -keystore "$GITHUB_WORKSPACE/candyhint-v14.keystore"             -storepass candyhint14             -keypass candyhint14             -alias candyhint14             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Candy Hint V14 Note10,O=Local Build,C=VN"

          "$BT/apksigner" sign             --ks "$GITHUB_WORKSPACE/candyhint-v14.keystore"             --ks-pass pass:candyhint14             --key-pass pass:candyhint14             --min-sdk-version 21             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$GITHUB_WORKSPACE/CandyHintV14-Note10.apk"             "$GITHUB_WORKSPACE/CandyHintV14-aligned.apk"

      - name: Verify install compatibility
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"

          VERIFY="$("$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/CandyHintV14-Note10.apk")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q "Verified using v1 scheme (JAR signing): true"
          echo "$VERIFY" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"

          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/CandyHintV14-Note10.apk" | tee /tmp/badging.txt
          grep -q "package: name='com.tsufung.candyhintv14note10'" /tmp/badging.txt
          grep -q "sdkVersion:'21'" /tmp/badging.txt
          grep -q "targetSdkVersion:'31'" /tmp/badging.txt

          sha256sum "$GITHUB_WORKSPACE/CandyHintV14-Note10.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandyHintV14-Note10-APK
          path: CandyHintV14-Note10.apk
          if-no-files-found: error
          retention-days: 14

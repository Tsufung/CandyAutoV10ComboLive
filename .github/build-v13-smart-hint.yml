      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Sign APK
        shell: bash
        run: |
          UNSIGNED="$(find "$GITHUB_WORKSPACE/project/app/build/outputs/apk/release" -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$GITHUB_WORKSPACE/CandyHintV13-aligned.apk"
          keytool -genkeypair             -keystore "$GITHUB_WORKSPACE/candyhint-v13.keystore"             -storepass candyhint13             -keypass candyhint13             -alias candyhint13             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Candy Hint V13 Smart,O=Local Build,C=VN"
          "$BT/apksigner" sign             --ks "$GITHUB_WORKSPACE/candyhint-v13.keystore"             --ks-pass pass:candyhint13             --key-pass pass:candyhint13             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$GITHUB_WORKSPACE/CandyHintV13-Smart.apk"             "$GITHUB_WORKSPACE/CandyHintV13-aligned.apk"

      - name: Verify APK
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/CandyHintV13-Smart.apk"
          "$BT/aapt" dump xmltree "$GITHUB_WORKSPACE/CandyHintV13-Smart.apk" AndroidManifest.xml > /tmp/manifest.txt
          ! grep -q "BIND_ACCESSIBILITY_SERVICE" /tmp/manifest.txt
          ! grep -q "android.accessibilityservice.AccessibilityService" /tmp/manifest.txt
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/CandyHintV13-Smart.apk" | head -n 20
          sha256sum "$GITHUB_WORKSPACE/CandyHintV13-Smart.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandyHintV13-Smart-APK
          path: CandyHintV13-Smart.apk
          if-no-files-found: error
          retention-days: 14

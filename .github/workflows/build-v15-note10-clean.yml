name: Build Candy Hint V15 Note10 CLEAN APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore project from V14 FIX and patch to V15
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, zipfile, shutil

          wf = Path('.github/workflows/build-v14-note10-fix.yml')
          if not wf.exists():
              raise SystemExit('Missing .github/workflows/build-v14-note10-fix.yml')

          text = wf.read_text()
          m = re.search(r"cat > /tmp/v14fix\.b64 <<'PAYLOAD'\n(.*?)\n\s*PAYLOAD", text, re.S)
          if not m:
              raise SystemExit('Could not extract V14 project payload')

          z = Path('/tmp/v14-project.zip')
          z.write_bytes(base64.b64decode(''.join(m.group(1).split())))
          root = Path('project')
          shutil.rmtree(root, ignore_errors=True)
          root.mkdir()
          with zipfile.ZipFile(z) as f:
              f.extractall(root)

          gradle = root / 'app/build.gradle.kts'
          s = gradle.read_text()
          s = s.replace('applicationId = "com.tsufung.candyhintv14note10"',
                        'applicationId = "com.tsufung.candyhintv15note10clean"')
          s = s.replace('versionCode = 1401', 'versionCode = 1501')
          s = s.replace('versionName = "14.0.1-note10-compat"',
                        'versionName = "15.0.1-note10-clean"')
          gradle.write_text(s)

          manifest = root / 'app/src/main/AndroidManifest.xml'
          ms = manifest.read_text().replace(
              'android:label="Candy Hint V14 Note10"',
              'android:label="Candy Hint V15 Note10"')
          manifest.write_text(ms)

          assert 'applicationId = "com.tsufung.candyhintv15note10clean"' in gradle.read_text()
          assert 'versionCode = 1501' in gradle.read_text()
          assert 'targetSdk = 31' in gradle.read_text()
          PY

      - name: Restore fixed V15 signing key from GitHub Secret
        shell: bash
        env:
          V15_KEYSTORE_B64: ${{ secrets.V15_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${V15_KEYSTORE_B64:-}" ]; then
            echo "ERROR: Missing repository secret V15_KEYSTORE_B64"
            exit 1
          fi
          printf '%s' "$V15_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/candyhint-v15-fixed.keystore"
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/candyhint-v15-fixed.keystore" \
            -storepass candyhintv15fixed \
            -alias candyhintv15 >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Align and sign V15 APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$(find "$GITHUB_WORKSPACE/project/app/build/outputs/apk/release" -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED"
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/zipalign" -p -f 4 \
            "$UNSIGNED" \
            "$GITHUB_WORKSPACE/CandyHintV15-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/candyhint-v15-fixed.keystore" \
            --ks-pass pass:candyhintv15fixed \
            --key-pass pass:candyhintv15fixed \
            --ks-key-alias candyhintv15 \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$GITHUB_WORKSPACE/CandyHintV15-Note10-CLEAN.apk" \
            "$GITHUB_WORKSPACE/CandyHintV15-aligned.apk"

      - name: Verify APK before upload
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"

          "$BT/apksigner" verify --verbose --print-certs \
            "$GITHUB_WORKSPACE/CandyHintV15-Note10-CLEAN.apk" | tee /tmp/verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/verify.txt

          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/CandyHintV15-Note10-CLEAN.apk" | tee /tmp/badging.txt
          grep -q "package: name='com.tsufung.candyhintv15note10clean'" /tmp/badging.txt
          grep -q "versionCode='1501'" /tmp/badging.txt
          grep -q "sdkVersion:'21'" /tmp/badging.txt
          grep -q "targetSdkVersion:'31'" /tmp/badging.txt

          sha256sum "$GITHUB_WORKSPACE/CandyHintV15-Note10-CLEAN.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CandyHintV15-Note10-CLEAN-APK
          path: CandyHintV15-Note10-CLEAN.apk
          if-no-files-found: error
          retention-days: 14

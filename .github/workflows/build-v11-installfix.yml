          unzip -q /tmp/v11.zip -d "$GITHUB_WORKSPACE/project"
          grep -q 'applicationId = "com.tsufung.candyautov11installfix"' "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' "$GITHUB_WORKSPACE/project/app/build.gradle.kts"
          grep -q '^android.useAndroidX=true' "$GITHUB_WORKSPACE/project/gradle.properties"
          echo "Install-fix project restored"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: project
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Create signing key and sign APK with v1 v2 v3
        shell: bash
        run: |
          UNSIGNED="$(find "$GITHUB_WORKSPACE/project/app/build/outputs/apk/release" -type f -name '*unsigned*.apk' | head -n 1)"
          test -n "$UNSIGNED"

          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$GITHUB_WORKSPACE/CandyAutoV11-aligned.apk"

          keytool -genkeypair             -keystore "$GITHUB_WORKSPACE/candy-v11-installfix.keystore"             -storepass candyv11pass             -keypass candyv11pass             -alias candyv11             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Candy Auto V11 Install Fix,O=Local Build,C=VN"

          "$BT/apksigner" sign             --ks "$GITHUB_WORKSPACE/candy-v11-installfix.keystore"             --ks-pass pass:candyv11pass             --key-pass pass:candyv11pass             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out "$GITHUB_WORKSPACE/CandyAutoV11-InstallFix.apk"             "$GITHUB_WORKSPACE/CandyAutoV11-aligned.apk"

      - name: Verify package and signatures
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/CandyAutoV11-InstallFix.apk"
          "$BT/aapt" dump badging "$GITHUB_WORKSPACE/CandyAutoV11-InstallFix.apk" | head -n 20
          test -s "$GITHUB_WORKSPACE/CandyAutoV11-InstallFix.apk"
          sha256sum "$GITHUB_WORKSPACE/CandyAutoV11-InstallFix.apk"

      - name: Upload install-fix APK
        uses: actions/upload-artifact@v4
        with:
          name: CandyAutoV11-InstallFix-APK
          path: CandyAutoV11-InstallFix.apk
          if-no-files-found: error
          retention-days: 14
